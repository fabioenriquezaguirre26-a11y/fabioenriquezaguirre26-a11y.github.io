<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ministerios de Clubs JA: Aventureros, Conquistadores y Guía Mayor</title>
<meta name="description" content="Recursos para los ministerios de Aventureros, Conquistadores y Guía Mayor: especialidades con requisitos y fichas en PDF, clases progresivas, himno, formularios y libros.">
<meta property="og:title" content="Ministerios de Clubs JA">
<meta property="og:description" content="Especialidades, clases progresivas, himno, formularios y libros para Aventureros, Conquistadores y Guía Mayor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">

<style id="css">
:root{
  color-scheme: light;
  --navy:#13294b; --hero:#13294b; --hero-ink:#f4f1e8;
  --paper:#fbfaf7; --card:#ffffff; --ink:#16213a; --muted:#5b6478; --line:#e4e1d8;
  --gold:#c79a2e; --gold-soft:#f5ecd2; --red:#b02a30; --focus:#1f5fd1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --hero:#0a1322; --paper:#0e1626; --card:#152038; --ink:#e8ecf5; --muted:#9aa6bd; --line:#26324a;
    --gold:#e0b552; --gold-soft:#2a2615; --red:#e0656b; --focus:#7fb0ff; --navy:#e0b552;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --hero:#0a1322; --paper:#0e1626; --card:#152038; --ink:#e8ecf5; --muted:#9aa6bd; --line:#26324a;
  --gold:#e0b552; --gold-soft:#2a2615; --red:#e0656b; --focus:#7fb0ff; --navy:#e0b552;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:17px;line-height:1.6}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
button{font-family:inherit}
[hidden]{display:none !important}
[data-t]{white-space:pre-line}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* encabezado con pestañas */
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;text-decoration:none;flex:none}
.brand svg,.brand img{width:28px;height:28px;object-fit:contain}
nav#tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:18px 12px 16px;border-bottom:3px solid transparent}
nav#tabs a:hover{color:var(--ink)}
nav#tabs a.on{color:var(--ink);border-bottom-color:var(--gold)}
.tog{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px "Source Sans 3",sans-serif;cursor:pointer}
@media(max-width:760px){
  .bar{flex-wrap:wrap;gap:0 12px;padding-top:8px}
  nav#tabs{order:3;width:100%;margin-left:0}
  nav#tabs a{padding:10px 12px 8px}
  .tog{margin-left:auto}
}
.editbar{background:var(--red);color:#fff}
.editbar .in{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.editbar .msg{flex:1 1 240px;font-size:15px}
.editbar .btn{padding:8px 18px;font-size:15px}

/* botones */
.btn{display:inline-block;border:0;border-radius:999px;padding:13px 26px;font:600 16px "Source Sans 3",sans-serif;text-decoration:none;cursor:pointer}
.btn.gold{background:var(--gold);color:#1a1405}
.btn.gold:hover{filter:brightness(1.08)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line:hover{box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.light{background:#fff;color:#7a1419}
.btn.light:disabled{opacity:.55;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red);margin-left:auto}
.btn.sm{padding:7px 16px;font-size:14px}

/* portada */
.hero{background:var(--hero) center/cover no-repeat;color:var(--hero-ink)}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:40px;padding-top:72px;padding-bottom:72px}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.02em}
.hero p.lead{max-width:48ch;font-size:19px;color:#d9deea;margin:20px 0 0}
.verse{margin:28px 0 0;padding:2px 0 2px 16px;border-left:3px solid var(--gold);max-width:44ch}
.verse p{margin:0;font-size:18px;color:#f4f1e8}
.verse cite{display:block;margin-top:6px;font-style:normal;font-size:15px;color:var(--gold)}
.hlogos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.hl{text-align:center;cursor:pointer}
.hl .hn{font:700 15px "Bricolage Grotesque",sans-serif;margin-top:10px;color:#f4f1e8}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:32px;padding-top:44px;padding-bottom:44px}.hlogos{max-width:420px}}

/* encabezado de página interna */
.phead{background:var(--hero);color:var(--hero-ink);padding:28px 0 40px}
.crumbs{font-size:15px;color:#c3cadb;margin-bottom:22px}
.crumbs a{color:#e8ecf5;text-decoration:none;border-bottom:1px solid rgba(232,236,245,.35)}
.crumbs a:hover{border-color:var(--gold);color:var(--gold)}
.crumbs i{font-style:normal;margin:0 8px;opacity:.6}
.pinfo{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.pinfo .lslot{width:104px}
.phead h1{font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-.015em}
.phead .psub{margin:6px 0 0;color:#d9deea;font-size:17px}
.phead .pintro{max-width:60ch;margin:22px 0 0;color:#d9deea;font-size:18px}

/* círculos de logo */
.lslot{display:block}
.disc{border-radius:50%;background:#fff;border:2px solid var(--gold);display:grid;place-items:center;overflow:hidden;margin:0 auto;aspect-ratio:1;width:100%}
.disc.md{width:112px}
.disc img,.disc svg{width:76%;height:76%;object-fit:contain}
.ictl{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ictl .btn{margin:0}

/* secciones */
section.block{padding:56px 0 64px;border-bottom:1px solid var(--line)}
.head{max-width:60ch;margin-bottom:28px}
.head h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.015em}
.head p{color:var(--muted);margin:10px 0 0}
.sels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
a.sel{display:block;text-decoration:none;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px 12px 20px;text-align:center}
a.sel:hover{border-color:var(--gold);background:var(--gold-soft)}
a.sel b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px;margin-top:14px}
a.sel span.s{font-size:14px;color:var(--muted)}
a.sel span.go{display:block;margin-top:12px;font-weight:600;font-size:14px;color:var(--ink)}
@media(max-width:560px){.sels{gap:8px}a.sel{padding:16px 6px}.disc.md{width:72px}a.sel b{font-size:16px}}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.scard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:22px}
a.scard:hover{border-color:var(--gold)}
a.scard h3{font-size:22px;margin-bottom:8px}
a.scard p{margin:0;color:var(--muted);font-size:16px}
a.scard small{display:block;margin-top:14px;font-weight:600;font-size:14px}
.note{font-size:14px;color:var(--muted);margin-top:20px}
.bh{font-size:24px;font-weight:800;margin-bottom:18px}

/* especialidades */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.search{flex:1 1 260px;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;font:600 14px "Source Sans 3",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#1a1405}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1a1405}}
.chip.sm{padding:4px 12px}
.count{color:var(--muted);font-size:15px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.spec{text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:18px;cursor:pointer;color:inherit;font:inherit}
.spec:hover{border-color:var(--gold)}
.spec h3{font-size:19px;font-weight:700;margin-bottom:4px}
.spec .cat{font-size:14px;color:var(--muted)}
.spec p{margin:10px 0 0;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:13px;font-weight:600;background:var(--gold-soft);border-radius:6px;padding:2px 8px}
.empty{color:var(--muted);padding:24px 0}
.more{display:block;margin:28px auto 0}

/* carpetas de clases y recursos */
.folders{display:grid;gap:12px}
.folder{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.folder summary{display:flex;align-items:center;gap:16px;padding:18px 20px;cursor:pointer;list-style:none}
.folder summary::-webkit-details-marker{display:none}
.folder summary::after{content:"+";margin-left:auto;font-size:26px;line-height:1;color:var(--muted);font-weight:600}
.folder[open] summary::after{content:"\2212"}
.folder .tab{width:6px;align-self:stretch;border-radius:3px;background:var(--tab,var(--gold))}
.folder .ttl b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px}
.folder .ttl small{color:var(--muted);font-size:14px}
.fbody{border-top:1px solid var(--line);padding:20px 24px 26px;display:grid;gap:22px}
.fbody h4,.blk h4{margin:0 0 8px;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.fbody .txt,.blk .txt{white-space:pre-wrap;margin:0}
.none{color:var(--muted);margin:0;font-size:15px}
.file{display:inline-block;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none;font-weight:600;font-size:15px;margin:0 8px 8px 0}
.file:hover{border-color:var(--gold)}
.blks{display:grid;gap:14px}
.blk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:20px 22px}
.blk h4{font-size:20px}
.addrow{margin-top:18px}

/* himno y mapa */
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox .dot{fill:var(--muted);opacity:.28}
.pin{cursor:pointer;outline:none}
.pin:focus-visible circle{stroke:var(--focus);stroke-width:4}
.pin circle{fill:var(--gold);stroke:#fff;stroke-width:2.5}
.pin text{font:800 11px "Source Sans 3",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px}
.pin:hover circle,.pin.on circle{fill:var(--red);r:11}
.hchips{margin-top:18px}
.hdet{margin-top:26px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:24px}
.hdet h3{font-size:26px;margin-bottom:14px}
.hdet h4{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;margin:20px 0 8px}
.hdet .lyr{white-space:pre-wrap;margin:0;max-width:60ch}
.hdet video{width:100%;max-width:640px;border-radius:10px;background:#000;display:block}

/* contacto */
.contact{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px}
@media(max-width:820px){.contact{grid-template-columns:1fr;gap:28px}}
form{display:grid;gap:18px}
label{display:grid;gap:6px;font-weight:600;font-size:15px}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=search],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit}
textarea{min-height:140px;resize:vertical}
input:user-invalid,textarea:user-invalid{border-color:var(--red)}
.status{min-height:1.5em;font-size:15px}
.status.err{color:var(--red)}
.status a{color:var(--focus);font-weight:600}
form .btn.gold{justify-self:start}
section#contacto{padding:64px 0;border-top:1px solid var(--line)}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:min(580px,calc(100vw - 32px));width:100%;max-height:calc(100vh - 32px);padding:28px;overflow:auto}
dialog::backdrop{background:rgba(10,19,34,.6)}
dialog h3{font-size:26px;margin-bottom:6px}
dialog .cat{color:var(--muted);margin:0 0 14px}
dialog .reqs{margin:18px 0 22px}
dialog .reqs h4{margin:0 0 6px;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
dialog .reqs .txt{white-space:pre-wrap;margin:0}
.dlg-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filebox{border:1.5px dashed var(--line);border-radius:10px;padding:14px}
.filebox b{font-size:15px}
.rm{border:0;background:none;color:var(--red);font:600 14px "Source Sans 3",sans-serif;cursor:pointer;padding:0 0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.colorrow{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.colorrow input{width:48px;height:36px;padding:0;border:1.5px solid var(--line);border-radius:8px;background:none}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--gold)}

/* modo editor */
body:not(.editing) .only-edit{display:none !important}
body.editing [data-t]{outline:1.5px dashed rgba(199,154,46,.85);outline-offset:3px;cursor:text;min-width:2ch;border-radius:2px}
body.editing [data-t]:focus{outline:2px solid var(--focus)}
body.editing [data-na]{outline:none;cursor:inherit}
</style>
</head>
<body>
<template id="headsrc">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ministerios de Clubs JA: Aventureros, Conquistadores y Guía Mayor</title>
<meta name="description" content="Recursos para los ministerios de Aventureros, Conquistadores y Guía Mayor: especialidades con requisitos y fichas en PDF, clases progresivas, himno, formularios y libros.">
<meta property="og:title" content="Ministerios de Clubs JA">
<meta property="og:description" content="Especialidades, clases progresivas, himno, formularios y libros para Aventureros, Conquistadores y Guía Mayor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
</template>
<template id="shell">
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/" aria-label="Inicio"><span id="brandIcon"></span><span data-t="brand" data-na="">Clubs JA</span></a>
    <nav id="tabs" aria-label="Principal">
      <a href="#/" data-go="inicio"><span data-t="nav_inicio" data-na="">Inicio</span></a>
      <a href="#/conquistadores" data-go="conquistadores"><span data-t="nav_conquistadores" data-na="">Conquistadores</span></a>
      <a href="#/aventureros" data-go="aventureros"><span data-t="nav_aventureros" data-na="">Aventureros</span></a>
      <a href="#/guia" data-go="guia"><span data-t="nav_guia" data-na="">Guía Mayor</span></a>
      <a href="#contacto" data-go="contacto"><span data-t="nav_contacto" data-na="">Contáctenos</span></a>
    </nav>
    <button class="tog" id="editToggle" type="button" hidden="">Modo editor</button>
  </div>
  <div class="editbar only-edit" id="editbar">
    <div class="wrap in">
      <div class="msg" id="editMsg">Modo editor. Escribe sobre cualquier texto con borde punteado. Los cambios solo los verá el mundo cuando publiques.</div>
      <button class="btn light" id="setBtn" type="button">Ajustes</button>
      <button class="btn light" id="pubBtn" type="button" disabled="">Publicar cambios</button>
    </div>
  </div>
</header>

<main id="inicio">
  <section class="hero" id="hero">
    <div class="wrap">
      <div>
        <h1 data-t="hero_title" data-multi="">Ministerios de Clubs JA</h1>
        <p class="lead" data-t="hero_text" data-multi="">Este es un espacio abierto para conocer los recursos de Aventureros, Conquistadores y Guía Mayor: especialidades con sus requisitos, clases progresivas, himno, formularios y libros. Te invitamos a recorrer cada ministerio y descubrir lo que hay para tu club.</p>
        <div class="verse">
          <p data-t="hero_verse" data-multi="">Acuérdate de tu Creador en los días de tu juventud.</p>
          <cite data-t="hero_ref">Eclesiastés 12:1</cite>
        </div>
      </div>
      <div class="hlogos" id="heroLogos"></div>
    </div>
  </section>

  <div id="view"></div>

  <section id="contacto">
    <div class="wrap contact">
      <div class="head" style="margin:0">
        <h2 data-t="c_title">Contáctenos</h2>
        <p data-t="c_text" data-multi="">¿Cómo podemos mejorar esta página? Cuéntanos tu idea, sin importar desde qué país nos visites. Todos los campos son obligatorios.</p>
      </div>
      <form id="form" novalidate="">
        <label><span data-t="c_l1">Nombre completo</span>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required="" minlength="5" placeholder="Nombre y apellidos">
        </label>
        <label><span data-t="c_l2">Correo electrónico</span>
          <input id="correo" name="correo" type="email" autocomplete="email" required="" placeholder="tucorreo@ejemplo.com">
        </label>
        <label><span data-t="c_l3">Tu comentario</span>
          <textarea id="comentario" name="comentario" required="" minlength="10" placeholder="¿Qué te gustaría ver o cambiar?"></textarea>
        </label>
        <button class="btn gold" type="submit">Enviar comentario</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap"><span data-t="footer">Ministerios de Clubs JA. Un recurso abierto para clubes de todo el mundo.</span></div>
</footer>

<dialog id="detail">
  <h3 id="dTitle"></h3>
  <p class="cat" id="dCat"></p>
  <p id="dDesc"></p>
  <div class="reqs" id="dReqs"></div>
  <div class="dlg-actions">
    <a class="btn gold" id="dPdf" target="_blank" rel="noopener" hidden="">Descargar ficha en PDF</a>
    <button class="btn line only-edit" id="dEditBtn" type="button">Editar</button>
    <button class="btn line" type="button" data-close="">Cerrar</button>
  </div>
</dialog>

<dialog id="dEdit">
  <h3 id="eTitle">Editar especialidad</h3>
  <form id="fEdit" novalidate="">
    <label>Nombre
      <input id="eName" type="text">
    </label>
    <label>Categoría
      <select id="eCat"></select>
    </label>
    <label>Descripción breve
      <textarea id="eDesc" style="min-height:80px"></textarea>
    </label>
    <label>Requisitos
      <small>Escríbelos como quieres que se vean. Cada salto de línea se respeta.</small>
      <textarea id="eReq" style="min-height:170px"></textarea>
    </label>
    <div class="filebox">
      <b>Ficha en PDF</b>
      <div id="ePdfInfo" class="note" style="margin:6px 0 10px"></div>
      <input id="ePdf" type="file" accept=".pdf,application/pdf">
      <div class="status" id="ePdfMsg"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn gold" type="submit">Guardar cambios</button>
      <button class="btn line" type="button" data-close="">Cancelar</button>
      <button class="btn danger" type="button" id="eDel">Eliminar</button>
    </div>
    <div class="status err" id="eErr"></div>

<script id="data" type="application/json">{"specs":[{"id":"smv74qakhx2o","n":"Servicio comunitario","c":"ADRA","d":"","r":"### Requisitos\n\n1. Lea los siguientes textos bíblicos y explique lo que enseñan acerca del papel que Dios espera que cada cristiano desempeñe para satisfacer las necesidades de los pobres y necesitados de la comunidad.\n\n   a. Isaías 58:3-12.\n\n   b. Lucas 10:25-37.\n\n   c. Mateo 25:31-46.\n\n2. Explique a su instructor lo siguiente:\n\n   a. ¿Qué significa la sigla ADRA? Explique brevemente qué representa cada letra y describa la diferencia entre «asistencia» y «desarrollo».\n\n   b. ¿Cómo se llama el servicio social que ofrece la Iglesia Adventista del Séptimo Día local para ayudar a los pobres y necesitados de su entorno? ¿Qué tipos de servicios proporciona?\n\n3. Reúnase con el líder de Acción Solidaria Adventista de su área y pregúntele acerca de los proyectos en los que su unidad o Club de Conquistadores puede colaborar para satisfacer las necesidades de la comunidad local.\n\n4. Realice y complete un proyecto de servicio comunitario con su unidad o con el Club de Conquistadores. El proyecto debe centrarse en algunas de las necesidades de su comunidad y dedicar aproximadamente diez horas en total, desde la planificación hasta la ejecución.","pdf":null,"ej":false},{"id":"smv74pf60eg5","n":"Respuesta a emergencias y desastres - Avanzado","c":"ADRA","d":"","r":"### Requisitos\n\n1. Tener la especialidad «Respuesta a emergencias y desastres».\n\n2. Describa las causas subyacentes de cada uno de los siguientes tipos de desastres y proporcione un ejemplo reciente de al menos seis de ellos, explicando su impacto en la comunidad o el país. Mencione al menos un desastre en el que ADRA haya respondido.\n\n   a. Ciclones (huracanes y tifones).\n\n   b. Tornados.\n\n   c. Inundaciones.\n\n   d. Sequías.\n\n   e. Tsunamis.\n\n   f. Incendios.\n\n   g. Guerras, conflictos armados o guerras civiles.\n\n   h. Erupciones volcánicas.\n\n3. Las cuatro fases de la gestión de emergencias y desastres son: prevención/mitigación, preparación, respuesta y recuperación. Explique a su instructor, con sus propias palabras, qué significa cada uno de estos términos y por qué son importantes.\n\n4. La preparación es fundamental durante una emergencia o desastre. Describa a su instructor qué artículos incluiría en un kit de emergencia. Analice las ventajas de elegir artículos que funcionen con baterías en lugar de depender de la electricidad, así como alimentos no perecederos en lugar de perecederos.\n\n5. Dibuje un plano del lugar donde vive. Considere qué haría ante tres de los desastres mencionados en el requisito 2. Trace una ruta de escape desde su casa y analícela con su instructor y su familia.\n\n6. Encuentre tres historias bíblicas en las que ocurran desastres naturales o emergencias políticas. Póngase en el lugar de las personas de cada historia y describa cómo le afectarían esos acontecimientos. Además, analice brevemente cómo sobrevivieron las personas involucradas.\n\n7. Presente un breve informe a su Club de Conquistadores sobre lo aprendido acerca de las emergencias y los desastres, y cómo prepararse para actuar ante estas circunstancias. Puede realizar una presentación, dramatización, mostrar un video corto u utilizar otro método que permita transmitir lo aprendido.","pdf":null,"ej":false},{"id":"smv74nzqi33d","n":"Respuesta a emergencias y desastres","c":"ADRA","d":"","r":"### Requisitos\n\n1. Explique los tipos de daños que tienen mayor probabilidad de ocurrir en viviendas, personas y comunidades ante los principales tipos de emergencias y desastres. Indique también en qué partes del mundo ocurren con mayor frecuencia. Puede encontrar esta información en Defensa Civil de su departamento, provincia o región.\n\n   a. Ciclones (huracanes o tifones).\n\n   b. Tornados.\n\n   c. Inundaciones.\n\n   d. Terremotos.\n\n   e. Tsunamis.\n\n   f. Incendios.\n\n   g. Guerras, conflictos armados o guerras civiles.\n\n2. Describa brevemente los tipos de servicios que ADRA u otros organismos locales de respuesta a emergencias y desastres brindan a los sobrevivientes de estos eventos en su país.\n\n3. Lea noticias sobre emergencias y desastres recientes en un periódico o en las publicaciones de ADRA. Converse sobre algunos aspectos importantes que deben tenerse en cuenta al responder ante una situación de este tipo.\n\n4. Explique qué significa cada letra del acrónimo ADRA y describa su función en la respuesta a emergencias y desastres.\n\n5. Describa al menos una de las siguientes organizaciones de respuesta a emergencias y desastres, y explique cómo puede trabajar junto con ADRA durante estas situaciones:\n\n   a. Cruz Roja / Comité Internacional de la Cruz Roja (CICR).\n\n   b. Acción Solidaria Adventista (ASA).\n\n   c. Alto Comisionado de las Naciones Unidas para los Refugiados (ACNUR).\n\n   d. Programa Mundial de Alimentos (PMA).\n\n6. Explique el papel del gobierno cuando ocurre una emergencia o desastre e identifique la principal entidad gubernamental encargada de gestionar la respuesta ante estas situaciones en su país.\n\n7. Encuentre en la Biblia un texto que pueda utilizarse para consolar y animar a una persona que haya perdido completamente su vivienda. Comparta el texto y explique por qué lo eligió.","pdf":null,"ej":false},{"id":"smv74lscw232","n":"Resolucion de conflictos","c":"ADRA","d":"","r":"### Requisitos\n\n1. Defina el término «conflicto» y cite un ejemplo de conflicto en cada uno de los siguientes ámbitos:\n\n   a. Una familia.\n\n   b. Un grupo de amigos.\n\n   c. Una escuela.\n\n   d. Entre barrios o comunidades.\n\n   e. Entre países.\n\n2. ¿Qué es la resolución de conflictos?\n\n3. Converse con su instructor o consejero sobre cuatro causas probables que pueden generar conflictos en la escuela o en el ambiente de trabajo.\n\n4. Busque información sobre formas alternativas de resolución de conflictos: negociación, mediación, conciliación y arbitraje. Explique con sus propias palabras cada concepto y dé un ejemplo de cada alternativa.\n\n5. Explique en qué consiste la dramatización como una dinámica útil para la resolución de conflictos y cuáles pueden ser sus beneficios. Dé un ejemplo y represéntelo con su unidad.\n\n6. ¿Qué significa escuchar activamente?\n\n7. Aplique el siguiente método de resolución de conflictos a un ejemplo del punto número 1:\n\n   a. Armar el escenario.\n\n   b. Reunir información.\n\n   c. Identificar el problema.\n\n   d. Pensar en las soluciones.\n\n   e. Negociar una solución.\n\n8. Explique cómo derivar un conflicto a un consejero profesional o pastor.\n\n9. ¿Qué actitud recomienda Jesús en Mateo 18:5 para resolver un conflicto entre sus seguidores?\n\n   a. ¿Cuál es el papel de Jesucristo en el conflicto entre el bien y el mal, de acuerdo con 1 Timoteo 2:5 y 6?\n\n   b. Mencione otro personaje bíblico que haya actuado como mediador entre las autoridades y su pueblo.","pdf":null,"ej":false},{"id":"smv74jq7hbu6","n":"Reasentamiento de refugiados","c":"ADRA","d":"","r":"Reasentamiento de refugiados\n\n1. Describir algunas causas generales por las que las personas se trasladan a otros países como refugiados. También definir los términos “refugiado”, “desplazado interno” y “emigrante”.\n\n2. Enumerar las necesidades inmediatas que un refugiado puede tener cuando llega a un país nuevo. Describir cómo te sentirías si súbitamente tuvieras que enfrentar un idioma, una cultura y un ambiente nuevos.\n\n3. Descubrir qué organizaciones en tu comunidad, en tu país o en el mundo ayudan a los refugiados y desplazados internos. Investigar sobre el trabajo que realizan.\n\n4. Describir brevemente cómo podrías ayudar a un refugiado o a un desplazado interno en tu comunidad.\n\n5. Preguntarle a una persona de otro país que viva en tu comunidad cómo se adaptó al nuevo ambiente. Pedirle que describa los desafíos y contrastes que experimentó durante el proceso de adaptación a la comunidad.\n\n6. Hacer un informe breve para tu Club de Conquistadores, iglesia, escuela o a un grupo cívico, sobre lo aprendido acerca de refugiados y desplazados internos y qué desafíos enfrentan. Este requisito se puede realizar a través de una presentación audiovisual, dramatización, video o cualquier otra forma que transmita mejor lo descubierto. Discutir por qué es importante estar atento a la situación de los refugiados y buscar soluciones para ese problema.\n\n7. Encontrar un refugiado y/o desplazado interno y ayudarlo junto con ASA local. Poner la foto y la descripción de la ayuda.","pdf":null,"ej":false},{"id":"smv74i5mrb5","n":"Desarrollo Comunitario","c":"ADRA","d":"","r":"1. Definir “desarrollo comunitario”.\n\n2. Explicar a tu instructor por qué algunos países son considerados desarrollados mientras que a otros se los llama países en vías de desarrollo.\n\n3. Mencionar cinco países en vías de desarrollo y enumerar tres acciones que ADRA realiza en ellos y que podrían ser consideradas acciones de desarrollo y dos que se caracterizan como acciones asistenciales.\n\n4. Leer acerca de por qué existen pobres entre nosotros en el libro El Libertador o El Deseado de todas las gentes, de Elena de White, capítulo 70 – “Cristo se identifica con los pobres y los que sufren” / “Estos mis hermanos pequeñitos”. Describir lo que aprendiste a tu instructor.\n\n5. Describir, por lo menos, una necesidad en tu barrio o municipio que requiera atención.\n\n6. Escribir un breve plan de desarrollo comunitario que podría ser implementado por tu Club de Conquistadores (plantación de árboles, limpieza de parques y calles, pintura de muros, etc.). El plan debe describir la actividad, el tamaño del grupo, la logística de transporte, los materiales y el tiempo para completar esa actividad.\n\n7. Participar, por lo menos, durante cuatro horas en una de las siguientes actividades:\n\na) El conquistador deberá contactar a Acción Solidaria Adventista (ASA) de su iglesia y ver en qué podría ayudar. Tal vez, organizando artículos donados o participando de algún proyecto ya establecido. Podrá involucrarse en la recolección y distribución de alimentos, colchas o mantas, abrigos, zapatos y otros bienes para personas sin techo o para las familias registradas por ASA. Además, podrá apoyar en la reparación o construcción de casas para personas carenciadas.\n\nb) El conquistador deberá contactarse con ADRA para ver la posibilidad de participar como voluntario en algún proyecto que esté siendo implementado en su barrio o municipio.\n\nc) El conquistador deberá involucrarse en un proyecto social. El propósito de este tipo de acción es proporcionar a la población menos favorecida acceso a ciertos servicios de forma gratuita. Algunos de estos servicios son: corte de cabello, exámenes rápidos para identificar enfermedades como sífilis, hepatitis y SIDA, medición de la presión arterial, orientaciones de salud y nutrición, charlas educativas sobre cómo economizar energía y gas, recreación infantil, emisión de documentos, información sobre vacantes de empleos, entre otros. El proyecto puede hacerse en el patio de la iglesia, en un gimnasio deportivo o en otro lugar sugerido y autorizado por las autoridades locales.\n\nd) El conquistador intentará saber lo que su iglesia, otras iglesias, el gobierno o las organizaciones comunitarias están haciendo para personas sin techo. Si la comunidad ya tiene ese programa, podría unirse a él.","pdf":null,"ej":false},{"id":"smv741c84ae9","n":"Evaluacion de la comunidad","c":"ADRA","d":"","r":"1. Seleccione un barrio urbano o suburbano que conozca y describa los siguientes aspectos:\n\n   a. Ubicación en un mapa físico o digital.  \n   b. Demografía: edades, sexo y otros datos relevantes de los residentes.  \n   c. Condiciones socioeconómicas.  \n   d. Ocupaciones laborales más comunes.  \n   e. Acceso a los servicios educativos y de salud.  \n   f. Nivel educativo de la población.  \n   g. Otros datos que considere relevantes.\n\n2. Elabore una lista de las principales necesidades de la comunidad. Incluya, por ejemplo, apoyo a familias de bajos recursos, acompañamiento a personas mayores o solitarias y limpieza de parques y espacios públicos.\n\n3. Entreviste a un líder comunitario, docente, pastor u oficial de policía sobre las maneras de generar un impacto positivo en la comunidad. Tome notas durante la entrevista.\n\n4. Presente a su Club de Conquistadores un informe creativo sobre la información recopilada y lo aprendido acerca de la comunidad seleccionada.\n\n5. Identifique la necesidad más importante de la comunidad y describa qué acciones podrían realizarse para contribuir a mejorarla.","pdf":null,"ej":false},{"id":"s1","n":"Aeromodelismo","c":"Artes y manualidades","d":"","r":"1. Arme, a partir de un kit, y vuele con éxito un aeroplano propulsado por un motor de gasolina, fabricado con madera ligera, papel de seda y goma, u otros materiales.\n\n2. Arme un planeador a partir de un kit, observe sus características de vuelo y explique su relación con las posiciones variables de las alas.\n\n3. Arme y vuele con éxito dos modelos diferentes de aviones utilizando hojas de papel de entre 20 y 35 centímetros de largo y ancho.\n\n4. Defina, señale dónde se encuentran y explique la función de los siguientes elementos básicos de una aeronave:\n\n   a. Fuselaje.\n\n   b. Ala.\n\n   c. Timón.\n\n   d. Estabilizador horizontal.\n\n   e. Tirante.\n\n   f. Cabina.\n\n   g. Motor.\n\n   h. Tren de aterrizaje.\n\n   i. Hélice.","pdf":null,"ej":false},{"id":"s2","n":"Album de recortes","c":"Artes y manualidades","d":"","r":"1. ¿Para qué sirve un álbum de recortes?\n\n2. ¿Qué es el «journaling»?\n\n3. ¿Cuáles son los diferentes tipos de álbumes que se utilizan para hacer un álbum de recortes?\n\n4. ¿Por qué se deben utilizar materiales sin ácido?\n\n5. Describa los diferentes tipos de adhesivos o pegamentos sin ácido disponibles en el mercado.\n\n6. ¿Qué herramienta se utiliza para afilar tijeras y estiletes o cúteres cuando pierden el filo?\n\n7. Nombre cinco tipos diferentes de papel sin ácido que se utilizan para elaborar álbumes de recortes.\n\n8. Elabore un álbum de recortes de al menos cinco páginas, de 20 × 20 cm o más, sobre uno de los siguientes temas. Utilice papeles de colores, pegatinas, tijeras decorativas, un título y *journaling*.\n\n   a. Año escolar.\n\n   b. Evento deportivo.\n\n   c. Vacaciones.\n\n   d. Días festivos.\n\n   e. Proyectos.\n\n   f. Casamiento.\n\n   g. Fiestas de cumpleaños.\n\n   h. Investidura.\n\n   i. Camporí.\n\n   j. Todo sobre mí (desde que nací hasta hoy).","pdf":{"id":"18d58e5a512736f7215a15483a10d892","name":"Especialidad de Album de recortes.pdf"},"ej":false},{"id":"s3","n":"Primeros auxilios básico","c":"Actividades agrícolas","d":"Qué hacer ante una emergencia hasta que llegue la ayuda.","r":"","pdf":null,"ej":true},{"id":"s4","n":"Nudos","c":"Actividades misioneras","d":"Los nudos más útiles para acampar, amarrar y rescatar.","r":"","pdf":null,"ej":true},{"id":"s5","n":"Acampada","c":"Actividades misioneras","d":"Organiza y disfruta un campamento con seguridad.","r":"","pdf":null,"ej":true},{"id":"s6","n":"Orientación","c":"Actividades misioneras","d":"Usa mapa y brújula para ubicarte y llegar a un destino.","r":"","pdf":null,"ej":true},{"id":"s7","n":"Cocina","c":"Salud y ciencia","d":"Prepara comidas sencillas y nutritivas con higiene.","r":"","pdf":null,"ej":true},{"id":"s8","n":"Alivio del hambre","c":"ADRA","d":"","r":"1. Mire un reportaje sobre el hambre en el mundo y converse con su unidad del Club de Conquistadores sobre las medidas que se están tomando para combatirla.\n\n2. Entreviste a una persona encargada de distribuir alimentos en su comunidad, ya sea en una iglesia, un centro comunitario o un comedor popular. Pregunte quiénes reciben ayuda, por qué la necesitan y cómo se atienden sus necesidades. Tome notas y comparta los resultados con su instructor.\n\n3. Describa las causas del hambre en su país mediante un texto de al menos 5 var MIME = {pdf:"application/pdf", csv:"text/csv", png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", webp:"image/webp", gif:"image/gif", mp4:"video/mp4", webm:"video/webm", txt:"text/plain"};
function extOf(name){ var m = /\.([A-Za-z0-9]+)$/.exec(name || ""); return m ? m[1].toLowerCase() : ""; }
function badExt(ext, exts){
  if (ext === "xlsx" || ext === "xls") return "Los archivos de Excel (.xlsx) no se pueden guardar aquí. Abre tu Excel, elige Guardar como y luego CSV UTF-8, y sube ese archivo.";
  if (ext === "mp3" || ext === "m4a" || ext === "wav") return "El audio debe estar en formato MP4. Conviértelo a MP4 y vuelve a subirlo.";
  return "Ese tipo de archivo no se acepta aquí. Formatos permitidos: " + exts.join(", ").toUpperCase() + ".";
}
async function uploadFile(file, msgEl, exts){
  var ext = extOf(file.name), mime = MIME[ext];
  function say(t, err){ if (msgEl){ msgEl.className = "status" + (err ? " err" : ""); msgEl.textContent = t; } }
  if (!mime || exts.indexOf(ext) < 0){ say(badExt(ext, exts), true); return null; }
  if (file.size > 20 * 1024 * 1024){ say("El archivo pesa más de 20 MB. Comprímelo o divídelo.", true); return null; }
  say("Subiendo " + file.name + "…");
  try{
    var assets = await window.claude.use("assets");
    if (!assets){ say("Subir archivos solo funciona al abrir la página con tu cuenta de Claude, en modo editor.", true); return null; }
    var r = await assets.upload(file, {type: mime});
    say("Archivo subido.");
    return {id: r.id, name: file.name};
  }catch(e){
    var c = e && e.code;
    say(c === "too_large" ? "El archivo pesa más de 20 MB." :
        c === "quota_or_state" ? "Se llenó el espacio de almacenamiento de esta página. Revisa Ajustes, Ver almacenamiento." :
        c === "rate_limited" ? "Estás subiendo muy rápido. Espera unos segundos y vuelve a intentar." :
        "No se pudo subir el archivo (código: " + (c || "desconocido") + "). Intenta de nuevo.", true);
    return null;
  }
}
function bindSingle(inp, info, msg, ref, exts, none){

    inp.value = "";
  };
}
function bindMulti(inp, box, msg, arr, exts){

      row.appendChild(rm); box.appendChild(row);
    });
  }
  inp.value = ""; msg.textContent = ""; draw();
  inp.onchange = async function(){
    var fs = Array.prototype.slice.call(inp.files);
    for (var i = 0; i < fs.length; i++){

/* ---------- especialidades (con paginación para soportar cientos) ---------- */
function renderSpecs(c){
  var tools = el("div", "tools");
  var q = document.createElement("input"); q.type = "search"; q.className = "search"; q.value = term;
  q.placeholder = "Buscar una especialidad"; q.setAttribute("aria-label", "Buscar una especialidad");
  tools.appendChild(q);
  if (editing){
    var ab = el("button", "btn gold", "Agregar una"); ab.type = "button"; ab.onclick = function(){ openEditSpec(null); }; tools.appendChild(ab);
    var ib = el("button", "btn gold", "Importar muchas"); ib.type = "button"; ib.onclick = openImport; tools.appendChild(ib);
    var cb = el("button", "btn line", "Editar categorías"); cb.type = "button"; cb.onclick = openSettings; tools.appendChild(cb);
  }
  c.appendChild(tools);
  var chips = el("div", "chips"); c.appendChild(chips);
  var cnt = el("p", "count"); c.appendChild(cnt);
  var grid = el("div", "grid"); c.appendChild(grid);
  var more = el("button", "btn line more", "Mostrar más"); more.type = "button"; more.hidden = true; c.appendChild(more);
  var empty = el("p", "empty", "No hay especialidades con esa búsqueda. Prueba con otra palabra o pídenos la que falta en Contáctenos."); empty.hidden = true; c.appendChild(empty);
  if (cat !== "Todas" && state.cats.indexOf(cat) < 0) cat = "Todas";
  function drawChips(){
    chips.innerHTML = "";
    ["Todas"].concat(state.cats).forEach(function(n){
      var b = el("button", "chip", n); b.type = "button"; b.setAttribute("aria-pressed", String(n === cat));
      b.onclick = function(){ cat = n; shown = PAGE; drawChips(); drawGrid(); };
      chips.appendChild(b);
    });
  }
  function drawGrid(){
    var t = term.trim().toLowerCase();
    var list = state.specs.filter(function(s){
      if (cat !== "Todas" && s.c !== cat) return false;
      return !t || (s.n + " " + s.d).toLowerCase().indexOf(t) >= 0;
    }).sort(function(a, b){ return a.n.localeCompare(b.n, "es"); });
    grid.innerHTML = "";
    list.slice(0, shown).forEach(function(s){
      var b = el("button", "spec"); b.type = "button";
      b.appendChild(el("h3", null, s.n)); b.appendChild(el("div", "cat", s.c));
      if (s.d) b.appendChild(el("p", null, s.d));
      var tg = el("div", "tags");

      if (s.r) tg.appendChild(el("span", "tag", "Requisitos"));

      grid.appendChild(b);
    });

    more.hidden = list.length <= shown;
    more.textContent = "Mostrar más (" + Math.max(0, list.length - shown) + " restantes)";
    empty.hidden = list.length > 0;
  }
  more.onclick = function(){ shown += PAGE * 2; drawGrid(); };
  q.addEventListener("input", function(){ term = q.value; shown = PAGE; drawGrid(); });
  drawChips(); drawGrid();
}

/* importación masiva de fichas PDF */
function openImport(){
  fillCats($("iCat")); $("iFiles").value = ""; $("iMsg").textContent = ""; $("iMsg").className = "status";
  $("iProg").hidden = true; $("iStop").hidden = true; importStop = false;
  $("dImp").showModal();
}
$("iStop").onclick = function(){ importStop = true; $("iStop").hidden = true; };
$("iFiles").addEventListener("change", async function(){
  var files = Array.prototype.slice.call(this.files); if (!files.length) return;
  var bar = $("iProg"), fill = bar.firstChild, msg = $("iMsg"), category = $("iCat").value;
  bar.hidden = false; $("iStop").hidden = false; importStop = false; this.disabled = true;
  var ok = 0, skipped = 0, failed = [];
  var have = {}; state.specs.forEach(function(s){ have[(s.c + "|" + s.n).toLowerCase()] = true; });
  for (var i = 0; i < files.length; i++){
    if (importStop) break;
    var f = files[i], name = f.name.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim();
    fill.style.width = Math.round(i / files.length * 100) + "%";
    msg.className = "status"; msg.textContent = "Subiendo " + (i + 1) + " de " + files.length + ": " + f.name;
    if (have[(category + "|" + name).toLowerCase()]){ skipped++; continue; }
    var holder = el("span"), r = await uploadFile(f, holder, ["pdf"]);
    if (!r){
      failed.push(f.name);
      if (/espacio de almacenamiento|muy r.pido/.test(holder.textContent)){ msg.className = "status err"; msg.textContent = holder.textContent; break; }
      continue;
    }
    state.specs.push({id: uid("s"), n: name, c: category, d: "", r: "", pdf: r, ej: false}); have[(category + "|" + name).toLowerCase()] = true;
    ok++; markDirty();
  }
  fill.style.width = "100%"; this.disabled = false; this.value = ""; $("iStop").hidden = true;
  msg.className = "status" + (failed.length ? " err" : "");
  msg.textContent = "Listo: " + ok + " agregadas" + (skipped ? ", " + skipped + " omitidas por estar repetidas" : "") + (failed.length ? ", " + failed.length + " con error (" + failed.slice(0, 3).join(", ") + (failed.length > 3 ? "…" : "") + ")" : "") + ". Pulsa Publicar cambios para que el mundo las vea.";
  render(true);
});

function inPoly(x, y, p){
  var c = false;
  for (var i = 0, j = p.length - 1; i < p.length; j = i++){
    var xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
var MAPSVG = null;
function mapDots(){
  if (MAPSVG) return MAPSVG;
  var S = 1000 / 350, out = "", step = 2.4;
  for (var lat = 83; lat > -57; lat -= step){
    for (var lon = -169; lon < 180; lon += step){
      var land = false, i;
      for (i = 0; i < LAND.length && !land; i++) if (inPoly(lon, lat, LAND[i])) land = true;
      if (land) for (i = 0; i < HOLES.length; i++) if (inPoly(lon, lat, HOLES[i])) land = false;
      if (land) out += '<circle class="dot" cx="' + ((lon + 170) * S).toFixed(1) + '" cy="' + ((84 - lat) * S).toFixed(1) + '" r="2.4"/>';
    }
  }
  MAPSVG = out; return out;
}
